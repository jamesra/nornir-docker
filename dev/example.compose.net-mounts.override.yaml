# Template -> copy to D:\Docker\Run\nornir-dev\compose.net-mounts.override.yaml (not committed).
#
# Enables the in-container network-share mount manifest (CIFS/SMB3 + NFSv4) for cursor-dev.
# This grants CAP_SYS_ADMIN (required for the mount() syscall inside the container) and binds
# the manifest + secrets dirs read-only. Both binds are fixed regardless of how many shares the
# manifest lists, so adding/removing a share is a data change (edit nas-mounts.tsv), never a
# compose/Dockerfile edit.
#
# Prerequisites (see nornir-docker/windows-docker-layout/NORNIR_DEV_VOLUMES.md):
#   - cifs / nfsv4 kernel drivers loaded on the WSL2 host (shared kernel).
#   - NORNIR_NET_MOUNTS_DIR_HOST  -> dir containing nas-mounts.tsv
#   - NORNIR_NET_CREDS_DIR_HOST   -> dir containing per-share *.cred files (chmod 600)
#   - Put those vars in nornir-docker/.env (Compose substitution) as well as Run env files.
#
# Use with:
#   docker compose -f nornir-docker/compose.cursor-dev.yaml \
#     -f D:/Docker/Run/nornir-dev/compose.net-mounts.override.yaml run --rm --gpus all cursor-dev
#
# SECURITY: CAP_SYS_ADMIN is a real privilege increase. It is confined to this opt-in override;
# the default cursor-dev service (without this file) stays unprivileged.

services:
  cursor-dev:
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - "apparmor:unconfined"
    environment:
      NORNIR_NET_MOUNTS: "1"
    volumes:
      - type: bind
        source: ${NORNIR_NET_MOUNTS_DIR_HOST}
        target: /etc/nornir-net-mounts
        read_only: true
      - type: bind
        source: ${NORNIR_NET_CREDS_DIR_HOST}
        target: /run/secrets/net-creds
        read_only: true

  cursor-dev-clone:
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - "apparmor:unconfined"
    environment:
      NORNIR_NET_MOUNTS: "1"
    volumes:
      - type: bind
        source: ${NORNIR_NET_MOUNTS_DIR_HOST}
        target: /etc/nornir-net-mounts
        read_only: true
      - type: bind
        source: ${NORNIR_NET_CREDS_DIR_HOST}
        target: /run/secrets/net-creds
        read_only: true
