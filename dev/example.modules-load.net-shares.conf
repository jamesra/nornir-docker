# Template -> copy to the WSL2 host distro as /etc/modules-load.d/net-shares.conf
# (host, NOT inside the container). Loads the kernel filesystem drivers the
# in-container CIFS/NFS mounts depend on, into the single shared WSL2 kernel.
#
# Honored automatically when systemd is enabled in the distro
# (/etc/wsl.conf -> [boot] systemd=true). If systemd is off, load via a boot
# command instead, e.g. in /etc/wsl.conf:
#   [boot]
#   command = /sbin/modprobe cifs nfsv4
#
# Verify after a `wsl --shutdown` + relaunch:
#   grep -E 'cifs|nfs' /proc/filesystems
cifs
nfsv4
