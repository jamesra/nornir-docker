# Mosquitto broker configuration for the Nornir dashboard stack.
# Accepts connections from other containers on the shared compose network.
listener 1883 0.0.0.0

# Anonymous access (no username/password). The host-published 1883 port is
# exposed for remote build machines via NORNIR_MQTT_BIND_HOST (default 0.0.0.0)
# in compose.dashboard.yaml. Because access is anonymous and unencrypted, only
# expose this broker on a trusted network and scope 1883 with a host firewall;
# add a password_file/TLS here before any broader exposure.
allow_anonymous true

# Persist retained run metadata so the dashboard can recover after a restart.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
