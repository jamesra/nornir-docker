# Build from repository root (parent of nornir-docker):
#   docker compose -f nornir-docker/compose.yaml build
#
# For OCI labels with real VERSION, git SHA, and package BOM JSON, prefer docker-build.ps1
# or export NORNIR_RELEASE / SOURCE_REVISION / PACKAGE_VERSIONS_JSON before compose build.
#
# Run nornir-build with your data directory mounted (example):
#   docker compose -f nornir-docker/compose.yaml run --rm -v "%CD%:/workspace" -w /workspace nornir nornir-build --help

x-nornir-ulimits: &nornir-ulimits
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  nornir:
    <<: *nornir-ulimits
    shm_size: "64gb"
    build:
      context: ..
      dockerfile: nornir-docker/dev/Dockerfile
      args:
        CUPY_PACKAGE: cupy-cuda13x
        CUVS_PACKAGE: cuvs-cu13
        NVIDIA_CUDA_APT_VERSION: ${NVIDIA_CUDA_APT_VERSION:-13-3}
        NORNIR_RELEASE: ${NORNIR_RELEASE:-0.0.0-dev}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        IMAGE_SOURCE: ${IMAGE_SOURCE:-https://github.com/jamesra/nornir}
        NORNIR_IMAGE_VARIANT: dev
        IMAGE_TITLE: Nornir development image
        IMAGE_DESCRIPTION: Headless Nornir stack with pytest and CuPy for Python 3.14
    image: nornir:dev

  nornir-prod:
    <<: *nornir-ulimits
    shm_size: "64gb"
    build:
      context: ..
      dockerfile: nornir-docker/prod/Dockerfile
      args:
        NORNIR_RELEASE: ${NORNIR_RELEASE:-0.0.0-dev}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        IMAGE_SOURCE: ${IMAGE_SOURCE:-https://github.com/jamesra/nornir}
        NORNIR_IMAGE_VARIANT: prod
        IMAGE_TITLE: Nornir production image (CPU)
        IMAGE_DESCRIPTION: Headless Nornir production stack for Python 3.14 without CuPy
    image: nornir:prod

  nornir-cupy:
    <<: *nornir-ulimits
    shm_size: "64gb"
    build:
      context: ..
      dockerfile: nornir-docker/prod/Dockerfile
      args:
        INSTALL_CUPY: "1"
        CUPY_PACKAGE: cupy-cuda13x
        CUVS_PACKAGE: cuvs-cu13
        NVIDIA_CUDA_APT_VERSION: ${NVIDIA_CUDA_APT_VERSION:-13-3}
        NORNIR_RELEASE: ${NORNIR_RELEASE:-0.0.0-dev}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        IMAGE_SOURCE: ${IMAGE_SOURCE:-https://github.com/jamesra/nornir}
        NORNIR_IMAGE_VARIANT: prod-cupy
        IMAGE_TITLE: Nornir production image (CuPy)
        IMAGE_DESCRIPTION: Headless Nornir production stack for Python 3.14 with CuPy
    image: nornir:cupy
