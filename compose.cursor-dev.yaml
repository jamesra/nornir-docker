# Local Cursor-oriented dev shell: nornir:dev-cursor-base, monorepo at /workspace, test input at
# /nornir-testdata (read-only), env aligned with .cursor/environment.json.
#
# For nornir / nornir-prod / nornir-cupy, use compose.yaml (not included here).
#
# - cursor-dev (default): bind-mount monorepo root at /workspace (host checkout).
# - cursor-dev-clone: named volume + git clone/update (appliance / isolated tree).
#
# Copy nornir-docker/dev/example.cursor-dev.run.env to nornir-docker/.env and set NORNIR_TESTDATA_HOST
# to a path on the WSL2 filesystem (see nornir-docker/README.md and docs/docker/cursor_dev.rst).
#
# Optional repro corpus: set NORNIR_REPRO_DATA_HOST to a WSL/Linux path (mirrors Windows D:\Data); it is
# mounted read-only at /data. Compose sets INPUT_NORNIR_DATA=/data inside the container. If unset, a
# tiny placeholder under nornir-docker/dev/repro-data-mount-placeholder is mounted so compose still works.
#
# Test output: NORNIR_TESTOUTPUT_HOST (default D:/nornir-test-output) is bind-mounted at
# /tmp/nornir-test-output (TESTOUTPUTPATH). On WSL-only Compose, use /mnt/d/nornir-test-output instead.
#
# Legacy SCI SVN tree: NORNIR_LEGACY_CODE_HOST (default D:/src/SVN/SCI/trunk) is bind-mounted read-only
# at /legacycode. On WSL-only Compose, use /mnt/d/src/SVN/SCI/trunk instead.
#
# NAS Volumes: NORNIR_VOLUMES_HOST (WSL mount of \\192.168.0.199\Data\Volumes) is bind-mounted
# at /volumes and /storage4 (same source; /storage4 is a legacy path alias). If unset,
# nornir-docker/dev/volumes-mount-placeholder is mounted. Docker Desktop on Windows: use
# \\wsl.localhost\<Distro>\mnt\nornir-volumes (same style as NORNIR_TESTDATA_HOST).
#
# On start, cursor-dev-entry.sh runs install-monorepo-editables.sh (pip install -e --no-deps from /workspace).
#
# From monorepo root:
#   docker compose -f nornir-docker/compose.cursor-dev.yaml build cursor-dev
#   docker compose -f nornir-docker/compose.cursor-dev.yaml run --rm cursor-dev
#   docker compose -f nornir-docker/compose.cursor-dev.yaml run --rm cursor-dev-clone
# GPU (optional):
#   docker compose -f nornir-docker/compose.cursor-dev.yaml run --rm --gpus all cursor-dev

x-cursor-dev-app: &cursor-dev-app
  build:
    context: ..
    dockerfile: nornir-docker/dev/Dockerfile
    args:
      CUPY_PACKAGE: cupy-cuda13x
      NVIDIA_CUDA_APT_VERSION: ${NVIDIA_CUDA_APT_VERSION:-13-1}
      NORNIR_RELEASE: ${NORNIR_RELEASE:-0.0.0-dev}
      SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      IMAGE_SOURCE: ${IMAGE_SOURCE:-https://github.com/jamesra/nornir}
      NORNIR_IMAGE_VARIANT: dev-cursor-base
      IMAGE_TITLE: Nornir dev cursor base image
      IMAGE_DESCRIPTION: Headless Nornir stack with pytest and CuPy for Python 3.14 (no baked monorepo)
      INSTALL_MONOREPO_EDITABLES: "0"
      NORNIR_HEADLESS: 1
  image: nornir:dev-cursor-base
  working_dir: /workspace
  stdin_open: true
  tty: true
  command:
    - /bin/bash
    - /usr/local/bin/cursor-dev-entry.sh
    - bash

services:
  cursor-dev:
    <<: *cursor-dev-app
    gpus: all
    shm_size: "64gb"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      NORNIR_CLONE_URL: ${NORNIR_CLONE_URL:-https://github.com/jamesra/nornir.git}
      NORNIR_CLONE_BRANCH: ${NORNIR_CLONE_BRANCH:-dev}
      NORNIR_WORKSPACE_STRATEGY: mounted
      TESTINPUTPATH: /nornir-testdata
      TESTOUTPUTPATH: /tmp/nornir-test-output
      NORNIR_IMPORT_CACHE_PATH: ${NORNIR_IMPORT_CACHE_PATH:-/tmp/nornir-test-output/ImportCache}
      NORNIR_LOG_ROOT: /workspace/.nornir-logs
      NORNIR_HEADLESS: 1
      INPUT_NORNIR_DATA: /data
      # Publish build telemetry to the shared dashboard broker (compose.dashboard.yaml).
      # host.docker.internal reaches the host-published Mosquitto port from the container.
      NORNIR_MQTT_HOST: ${NORNIR_MQTT_HOST:-host.docker.internal}
      NORNIR_MQTT_PORT: ${NORNIR_MQTT_PORT:-1883}
      NORNIR_MQTT_ENABLE: ${NORNIR_MQTT_ENABLE:-1}
    volumes:
      - type: bind
        source: ${NORNIR_WORKSPACE_HOST:-..}
        target: /workspace
      - type: bind
        source: ${NORNIR_TESTDATA_HOST}
        target: /nornir-testdata
        read_only: true
      - type: bind
        source: ${NORNIR_REPRO_DATA_HOST:-./dev/repro-data-mount-placeholder}
        target: /data
        read_only: true
      - type: bind
        source: ${NORNIR_TESTOUTPUT_HOST:-D:/nornir-test-output}
        target: /tmp/nornir-test-output
      - type: bind
        source: ${NORNIR_LEGACY_CODE_HOST:-D:/src/SVN/SCI/trunk}
        target: /legacycode
        read_only: true
      - type: bind
        source: ${NORNIR_VOLUMES_HOST:-./dev/volumes-mount-placeholder}
        target: /volumes
      - type: bind
        source: ${NORNIR_VOLUMES_HOST:-./dev/volumes-mount-placeholder}
        target: /storage4
      - type: bind
        source: ./cursor-dev-entry.sh
        target: /usr/local/bin/cursor-dev-entry.sh
        read_only: true
      - type: bind
        source: ./install-monorepo-editables.sh
        target: /usr/local/bin/install-monorepo-editables.sh
        read_only: true

  cursor-dev-clone:
    <<: *cursor-dev-app
    gpus: all
    shm_size: "64gb"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      NORNIR_CLONE_URL: ${NORNIR_CLONE_URL:-https://github.com/jamesra/nornir.git}
      NORNIR_CLONE_BRANCH: ${NORNIR_CLONE_BRANCH:-dev}
      NORNIR_WORKSPACE_STRATEGY: clone
      NORNIR_CLONE_DEPTH: "0"
      TESTINPUTPATH: /nornir-testdata
      TESTOUTPUTPATH: /tmp/nornir-test-output
      NORNIR_IMPORT_CACHE_PATH: ${NORNIR_IMPORT_CACHE_PATH:-/tmp/nornir-test-output/ImportCache}
      NORNIR_LOG_ROOT: /workspace/.nornir-logs
      NORNIR_HEADLESS: 1
      INPUT_NORNIR_DATA: /data
      NORNIR_MQTT_HOST: ${NORNIR_MQTT_HOST:-host.docker.internal}
      NORNIR_MQTT_PORT: ${NORNIR_MQTT_PORT:-1883}
      NORNIR_MQTT_ENABLE: ${NORNIR_MQTT_ENABLE:-1}
    volumes:
      - type: volume
        source: cursor-dev-work
        target: /workspace
      - type: bind
        source: ${NORNIR_TESTDATA_HOST}
        target: /nornir-testdata
        read_only: true
      - type: bind
        source: ${NORNIR_REPRO_DATA_HOST:-./dev/repro-data-mount-placeholder}
        target: /data
        read_only: true
      - type: bind
        source: ${NORNIR_TESTOUTPUT_HOST:-D:/nornir-test-output}
        target: /tmp/nornir-test-output
      - type: bind
        source: ${NORNIR_LEGACY_CODE_HOST:-D:/src/SVN/SCI/trunk}
        target: /legacycode
        read_only: true
      - type: bind
        source: ${NORNIR_VOLUMES_HOST:-./dev/volumes-mount-placeholder}
        target: /volumes
      - type: bind
        source: ${NORNIR_VOLUMES_HOST:-./dev/volumes-mount-placeholder}
        target: /storage4
      - type: bind
        source: ./cursor-dev-entry.sh
        target: /usr/local/bin/cursor-dev-entry.sh
        read_only: true
      - type: bind
        source: ./install-monorepo-editables.sh
        target: /usr/local/bin/install-monorepo-editables.sh
        read_only: true

volumes:
  cursor-dev-work:
